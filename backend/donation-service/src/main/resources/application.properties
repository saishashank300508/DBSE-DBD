spring.application.name=donation-service
server.port=8082

# ── MySQL ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/food_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── JWT (same secret as auth-service) ──────────────────────
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ── Inter-Service URLs ─────────────────────────────────────
services.auth-service.url=http://localhost:8081
services.notification-service.url=http://localhost:8083

# ── Donation business config ───────────────────────────────
donation.default-radius-km=10
donation.radius-expansion-km=5
donation.max-radius-km=50
donation.no-accept-timeout-minutes=30

# ── CORS ───────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# ── Logging ────────────────────────────────────────────────
logging.level.com.foodconnect=DEBUG

# ── OpenAPI ────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
