spring.application.name=auth-service
server.port=8081

# ── MySQL ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/food_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ────────────────────────────────────────────────────
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ── CORS (allow React dev server) ──────────────────────────
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# ── Logging ────────────────────────────────────────────────
logging.level.com.foodconnect=DEBUG
logging.level.org.springframework.security=INFO

# ── OpenAPI / Swagger ──────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
