spring.application.name=notification-tracking-service
server.port=8083

# ── MySQL ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/food_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── JWT (same secret) ──────────────────────────────────────
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ── Inter-service ──────────────────────────────────────────
services.auth-service.url=http://localhost:8081
services.donation-service.url=http://localhost:8082

# ── CORS ───────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# ── WebSocket ──────────────────────────────────────────────
websocket.endpoint=/ws
websocket.app-prefix=/app
websocket.broker-prefix=/topic,/queue

# ── Logging ────────────────────────────────────────────────
logging.level.com.foodconnect=DEBUG
logging.level.org.springframework.messaging=INFO

# ── OpenAPI ────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
